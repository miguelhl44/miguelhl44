# Regenerates the profile graphics once a day and commits only what changed.
#
# Deliberately no `push` trigger: this job pushes a commit itself, and a push
# trigger would make it re-run on its own commit forever.
name: refresh profile graphics

on:
  schedule:
    - cron: "23 4 * * *" # daily, 04:23 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-graphics
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Regenerate the SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python3 scripts/generate_stats.py

      - name: Commit changes, if any
        run: |
          if [ -z "$(git status --porcelain -- '*.svg')" ]; then
            echo "nothing changed"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.svg'
          git commit -m "chore: refresh profile graphics"
          git push
